name: Build Culprit Finder iOS

on:
  workflow_dispatch:
  push:
    branches:
      - figuring-out-culprit

jobs:
  build:
    name: iOS arm64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given
          bindings: geode-sdk/bindings
          bindings-ref: 6eb417ad2810fe43188bb94b6097562b201db0fa

      - name: Upload Culprit Finder
        uses: actions/upload-artifact@v7
        with:
          name: CulpritFinder-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
